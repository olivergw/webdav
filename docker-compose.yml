services:
  nginx:
    image: nginx:1.31.8-trixie
    container_name: webdav-nginx
    restart: unless-stopped
    depends_on:
      - webdav
    networks:
      - traefik_proxy
      - backend
    volumes:
      - ./nginx/webdav.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/block-exploits.conf:/etc/nginx/block-exploits.conf:ro

  webdav:
    image: chonjay21/webdav:latest
    container_name: webdav
    restart: unless-stopped

    environment:
      APP_USER_NAME: ${WEBDAV_USERNAME}
      APP_USER_PASSWD: ${WEBDAV_PASSWORD}
      APP_UID: 1001
      APP_GID: 1001
      APP_UMASK: "022"
      TZ: Europe/London
      USE_SSL: "false"

    volumes:
      - /opt/data/webdav:/var/webdav/data

    networks:
      - backend

networks:
  backend:
    internal: true
  traefik_proxy:
    external: true
    name: traefik_proxy
